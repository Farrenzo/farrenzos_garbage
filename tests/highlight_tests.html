<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FG match highlighting — CSS playground</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #222;
    color: #ccc;
    font: 13px/1.5 system-ui, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 18px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; color: #eee; }
  p  { margin: 0; color: #888; }
  label { display: block; margin-bottom: 6px; color: #999; }

  /* Roughly ComfyUI's multiline widget */
  #prompt {
    width: 100%;
    height: 150px;
    box-sizing: border-box;
    background: #1a1a1a;
    color: #e6e6e6;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    padding: 8px 10px;
    font: 13px/1.45 "Consolas", "Menlo", monospace;
    resize: vertical;
  }
  #prompt:focus { outline: 1px solid #5a5a5a; }

  #css {
    width: 100%;
    height: 190px;
    box-sizing: border-box;
    background: #1a1a1a;
    color: #cfcfcf;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    padding: 10px;
    font: 12px/1.5 "Consolas", "Menlo", monospace;
    resize: vertical;
  }

  .presets { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    background: #2e2e2e;
    color: #ddd;
    border: 1px solid #444;
    border-radius: 5px;
    padding: 5px 10px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #383838; border-color: #555; }

  /* ---- structural highlighter styles: leave these alone ---- */
  .fg-hl-overlay {
    position: fixed;
    overflow: hidden;
    pointer-events: none;
    z-index: 9999;
  }
  .fg-hl-scaler { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .fg-hl-mirror {
    position: absolute;
    box-sizing: border-box;
    margin: 0;
    border: 0;
    color: transparent;
    background: transparent;
  }
  .fg-hl-mirror mark { color: transparent; background: transparent; }
</style>
<style id="live-css"></style>
</head>
<body>
<div class="wrap">

  <div>
    <h1>Match highlighting — CSS playground</h1>
    <p>Select a word below. Every other literal occurrence lights up. Selecting <code>one,</code> hits two; selecting <code>one</code> hits three.</p>
  </div>

  <div>
    <label for="prompt">Prompt</label>
    <textarea id="prompt" spellcheck="false">one, two, three, one, four, five, one.

masterpiece, best quality, 1girl, solo, long hair, blue eyes, school uniform,
standing, outdoors, cherry blossoms, best quality, detailed background,
soft lighting, long hair, film grain, best quality</textarea>
  </div>

  <div>
    <label for="css">Highlight CSS — edits apply live</label>
    <textarea id="css" spellcheck="false"></textarea>
  </div>

  <div class="presets">
    <button data-preset="amber">Amber</button>
    <button data-preset="underline">Underline</button>
    <button data-preset="outline">Outline only</button>
    <button data-preset="teal">Teal fill</button>
    <button data-preset="magenta">Magenta glow</button>
  </div>

</div>

<script>
/* ------------------------------------------------------------------ *
 *  Same mirror-overlay highlighter used in the ComfyUI node.
 * ------------------------------------------------------------------ */

const MIRROR_PROPS = [
  "fontFamily", "fontSize", "fontWeight", "fontStyle", "fontVariant", "fontStretch",
  "letterSpacing", "wordSpacing", "lineHeight", "textIndent", "textTransform",
  "textAlign", "direction", "whiteSpace", "wordBreak", "overflowWrap", "tabSize",
  "paddingTop", "paddingRight", "paddingBottom", "paddingLeft",
];

function escapeHtml(text) {
  return text.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function attachMatchHighlighter(textarea, options = {}) {
  const {
    minLength     = 2,
    caseSensitive = false,
    trimSelection = true,
    hideOnBlur    = true,
    markSelf      = true,
  } = options;

  const overlay = document.createElement("div");
  overlay.className = "fg-hl-overlay";
  overlay.style.display = "none";
  const scaler = document.createElement("div");
  scaler.className = "fg-hl-scaler";
  const mirror = document.createElement("div");
  mirror.className = "fg-hl-mirror";
  scaler.appendChild(mirror);
  overlay.appendChild(scaler);
  document.body.appendChild(overlay);

  let rafId = 0, active = false;

  function findRanges(haystack, needle) {
    const hay = caseSensitive ? haystack : haystack.toLowerCase();
    const pin = caseSensitive ? needle : needle.toLowerCase();
    const ranges = [];
    let i = hay.indexOf(pin);
    while (i !== -1) {
      ranges.push([i, i + pin.length]);
      i = hay.indexOf(pin, i + pin.length);
    }
    return ranges;
  }

  function paint(text, ranges, selection) {
    let html = "", cursor = 0;
    for (const [start, end] of ranges) {
      const isSelf = selection && start === selection[0] && end === selection[1];
      if (isSelf && !markSelf) {
        html += escapeHtml(text.slice(cursor, end));
        cursor = end;
        continue;
      }
      html += escapeHtml(text.slice(cursor, start));
      html += '<mark class="' + (isSelf ? "fg-hl-self" : "fg-hl-match") + '">'
           +  escapeHtml(text.slice(start, end)) + '</mark>';
      cursor = end;
    }
    mirror.innerHTML = html + escapeHtml(text.slice(cursor)) + "\n";
  }

  function schedule() { if (!rafId && active) rafId = requestAnimationFrame(sync); }

  function sync() {
    rafId = 0;
    if (!active) return;
    if (!textarea.isConnected || textarea.offsetParent === null) return hide();

    const rect = textarea.getBoundingClientRect();
    if (rect.width < 1 || rect.height < 1) return hide();

    const cs = getComputedStyle(textarea);
    const scale = textarea.offsetWidth ? rect.width / textarea.offsetWidth : 1;

    overlay.style.left = rect.left + "px";
    overlay.style.top = rect.top + "px";
    overlay.style.width = rect.width + "px";
    overlay.style.height = rect.height + "px";
    overlay.style.borderRadius = cs.borderRadius;

    scaler.style.transform = "scale(" + scale + ")";

    for (const prop of MIRROR_PROPS) mirror.style[prop] = cs[prop];
    mirror.style.width = textarea.clientWidth + "px";
    mirror.style.left = (parseFloat(cs.borderLeftWidth) - textarea.scrollLeft) + "px";
    mirror.style.top = (parseFloat(cs.borderTopWidth) - textarea.scrollTop) + "px";

    schedule();
  }

  function hide() {
    active = false;
    overlay.style.display = "none";
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  }

  function update() {
    if (hideOnBlur && document.activeElement !== textarea) return hide();

    const text = textarea.value ?? "";
    let start = textarea.selectionStart ?? 0;
    let end   = textarea.selectionEnd ?? 0;
    let term  = text.slice(start, end);

    if (trimSelection) {
      const lead = term.length - term.trimStart().length;
      term = term.trim();
      start = start + lead;
      end = start + term.length;
    }

    if (term.length < minLength) return hide();

    const ranges = findRanges(text, term);
    if (ranges.length < 2) return hide();

    paint(text, ranges, [start, end]);
    active = true;
    overlay.style.display = "";
    sync();
  }

  const onSelectionChange = () => {
    if (document.activeElement === textarea) update();
    else if (hideOnBlur) hide();
  };

  document.addEventListener("selectionchange", onSelectionChange);
  textarea.addEventListener("input", update);
  textarea.addEventListener("mouseup", update);
  textarea.addEventListener("keyup", update);
  textarea.addEventListener("scroll", () => { if (active) sync(); });
  if (hideOnBlur) textarea.addEventListener("blur", hide);

  // Expose a repaint hook so live CSS edits refresh immediately.
  return { refresh: update, dispose: hide };
}

/* ------------------------------------------------------------------ *
 *  Playground wiring
 * ------------------------------------------------------------------ */

const PRESETS = {
  amber: `.fg-hl-mirror mark.fg-hl-match {
  background: rgba(255, 193, 7, 0.32);
  box-shadow: inset 0 0 0 1px rgba(255, 193, 7, 0.65);
  border-radius: 2px;
}
.fg-hl-mirror mark.fg-hl-self {
  background: rgba(255, 193, 7, 0.14);
  border-radius: 2px;
}`,

  underline: `.fg-hl-mirror mark.fg-hl-match {
  background: transparent;
  box-shadow: inset 0 -2px 0 0 #7aa2f7;
}
.fg-hl-mirror mark.fg-hl-self {
  background: transparent;
  box-shadow: inset 0 -2px 0 0 rgba(122, 162, 247, 0.35);
}`,

  outline: `.fg-hl-mirror mark.fg-hl-match {
  background: transparent;
  box-shadow: inset 0 0 0 1px rgba(200, 200, 200, 0.8);
  border-radius: 3px;
}
.fg-hl-mirror mark.fg-hl-self {
  background: transparent;
  box-shadow: inset 0 0 0 1px rgba(200, 200, 200, 0.25);
  border-radius: 3px;
}`,

  teal: `.fg-hl-mirror mark.fg-hl-match {
  background: rgba(45, 212, 191, 0.28);
  border-radius: 3px;
}
.fg-hl-mirror mark.fg-hl-self {
  background: rgba(45, 212, 191, 0.12);
  border-radius: 3px;
}`,

  magenta: `.fg-hl-mirror mark.fg-hl-match {
  background: rgba(217, 70, 160, 0.25);
  box-shadow: 0 0 6px rgba(217, 70, 160, 0.55);
  border-radius: 3px;
}
.fg-hl-mirror mark.fg-hl-self {
  background: rgba(217, 70, 160, 0.10);
  border-radius: 3px;
}`,
};

const prompt = document.getElementById("prompt");
const cssBox = document.getElementById("css");
const liveCss = document.getElementById("live-css");

const highlighter = attachMatchHighlighter(prompt);

function applyCss() {
  liveCss.textContent = cssBox.value;
  highlighter.refresh();
}

cssBox.value = PRESETS.amber;
applyCss();
cssBox.addEventListener("input", applyCss);

for (const button of document.querySelectorAll("[data-preset]")) {
  button.addEventListener("click", () => {
    cssBox.value = PRESETS[button.dataset.preset];
    applyCss();
    prompt.focus();
  });
}
</script>
</body>
</html>
